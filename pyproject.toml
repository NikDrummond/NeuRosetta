[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "NeuRosetta"
version = "0.1.0"
description = "Tools for morphological analysis of EM neuron reconstructions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "LGPL-3.0-only"
authors = [{ name = "Nik Drummond", email = "nikolasdrummond@gmail.com" }]
keywords = ["Morphology", "Connectomics", "topology", "geometry", "graphs"]
dependencies = [
  "numpy",
  "numba",
  "pandas",
  "scipy",
  "matplotlib",
  "vedo",
  "tqdm",
  "trimesh",
  "scikit-learn",
  "scikit-image",
  "PySide6",
  "pint",
  # graph-tool is required but only available via conda-forge:
  #   conda install -c conda-forge graph-tool
]

[project.urls]
Homepage = "https://github.com/NikDrummond/NeuRosetta"
Documentation = "https://nikdrummond.github.io/NeuRosetta/"
Repository = "https://github.com/NikDrummond/NeuRosetta"
Issues = "https://github.com/NikDrummond/NeuRosetta/issues"

[project.optional-dependencies]
dev = [
  "pytest",
  "mypy",
  "ruff",
  "pytest-cov",
  "types-tqdm",
]
docs = [
  "sphinx>=7",
  "myst-parser>=2",
  "sphinx-autodoc-typehints>=2",
  "furo>=2024",
  "sphinx-copybutton>=0.5",
]

[project.scripts]
run_neuro_GUI = "NeuRosetta.gui.main:start_GUI"

[tool.hatch.build.targets.wheel]
packages = ["src/NeuRosetta"]

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = ["E", "F", "I", "UP", "B", "SIM"]
lint.ignore = ["E203", "W503"]

[tool.ruff.lint.isort]
known-first-party = ["NeuRosetta"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=src/NeuRosetta",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-v"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
